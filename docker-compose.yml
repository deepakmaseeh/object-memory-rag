services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: object-memory-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.25-community
    container_name: object-memory-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/objectmemory
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/init-neo4j.cypher:/var/lib/neo4j/import/init-neo4j.cypher:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p objectmemory 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Optional: use native Ollama on Windows/macOS for GPU; enable with:
  # docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: object-memory-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:
